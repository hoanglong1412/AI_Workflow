name: Build Release

on:
  push:

jobs:
  build-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hello_world
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Run
        run: .\build\Release\hello.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-release
          path: hello_world/build/Release/hello.exe
